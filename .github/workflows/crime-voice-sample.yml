name: Crime Story Voice Sample
on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Gemini voice names, comma separated"
        default: "Charon"
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      SAMPLE_VOICES: ${{ github.event.inputs.voices }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install requests
      - run: python crime/voice_sample.py
      - uses: actions/upload-artifact@v4
        with:
          name: crime-voice-sample
          path: out/*.mp3
      - name: Save samples to the samples branch
        run: |
          mkdir -p /tmp/s && cp out/*.mp3 /tmp/s/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan samples && git rm -rfq . && cp /tmp/s/*.mp3 . && git add *.mp3
          git commit -qm "voice samples" && git push -f origin samples
