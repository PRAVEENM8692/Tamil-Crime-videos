name: Crime Story Build Video
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core libass9
          pip install pillow numpy
      - name: Get the pictures and the narration
        run: |
          mkdir -p pics voice
          git fetch -q --depth 1 origin pics-alavandar && git --work-tree=pics checkout FETCH_HEAD -- . && git reset -q
          git fetch -q --depth 1 origin voice-alavandar && git --work-tree=voice checkout FETCH_HEAD -- . && git reset -q
          fc-list | grep -i "Noto Sans Tamil" | head -2
      - run: python crime/build.py
      - name: Save the video to the video-alavandar branch
        run: |
          cp out/alavandar.mp4 /tmp/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q --orphan video-alavandar && git rm -rfq . && cp /tmp/alavandar.mp4 . && git add alavandar.mp4
          git commit -qm "Alavandar video" && git push -f origin video-alavandar
