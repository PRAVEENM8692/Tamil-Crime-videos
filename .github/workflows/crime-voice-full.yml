name: Crime Story Full Voice
on:
  workflow_dispatch:
    inputs:
      case:
        description: "case folder name under crime/ (default alavandar)"
        default: "alavandar"
      only:
        description: "Section numbers to make, comma separated (empty = all)"
        default: ""
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      ONLY: ${{ github.event.inputs.only }}
      CASE: ${{ github.event.inputs.case }}
      SCRIPT: crime/${{ github.event.inputs.case }}/script.txt
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install requests numpy
      - run: python crime/voice_full.py
      - name: Save the voice files to the voice-${CASE} branch
        run: |
          mkdir -p /tmp/s && cp out/* /tmp/s/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan voice-${CASE} && git rm -rfq . && cp /tmp/s/* . && git add *.mp3 durations.json
          git commit -qm "${CASE} voice" && git push -f origin voice-${CASE}
