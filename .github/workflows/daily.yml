name: Tamil Kids Story Videos
on:
  schedule:
    - cron: "7,37 3-16 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube? (true/false)"
        default: "false"
      slot:
        description: "Slot 1, 2 or 3"
        default: "1"
      dry_video:
        description: "true = free placeholder clips instead of paid Veo (layout test)"
        default: "false"
permissions:
  contents: write
concurrency:
  group: kids-story
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      VIDEO_MODEL: ${{ vars.VIDEO_MODEL }}
      VIDEO_RES: ${{ vars.VIDEO_RES }}
      VID_CONCURRENCY: ${{ vars.VID_CONCURRENCY }}
      NARRATOR_VOICE: ${{ vars.NARRATOR_VOICE }}
      VOICE_MAP: ${{ vars.VOICE_MAP }}
      INTRO: ${{ vars.INTRO }}
      INTRO_SECONDS: ${{ vars.INTRO_SECONDS }}
      BGM_FILE: ${{ vars.BGM_FILE }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python plan.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
      - if: steps.plan.outputs.slot != ''
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libass9
          pip install -r requirements.txt
      - if: steps.plan.outputs.slot != ''
        run: python pipeline.py
        env:
          SLOT: ${{ steps.plan.outputs.slot }}
          DRY_VIDEO: ${{ github.event.inputs.dry_video == 'true' }}
          UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' }}
      - if: always() && steps.plan.outputs.slot != ''
        uses: actions/upload-artifact@v4
        with:
          name: kids-video
          path: out
      - if: always() && steps.plan.outputs.slot != '' && (github.event_name == 'schedule' || github.event.inputs.upload == 'true')
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git pull --rebase && git push)
