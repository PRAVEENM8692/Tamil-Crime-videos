name: Crime Story Pictures
on:
  workflow_dispatch:
    inputs:
      case:
        description: "case folder name under crime/ (default alavandar)"
        default: "alavandar"
      only:
        description: "Scene numbers to draw, comma separated (empty = all that are still missing)"
        default: ""
      redo:
        description: "Scene numbers to draw again even if a picture exists"
        default: ""
permissions:
  contents: write
jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ONLY: ${{ github.event.inputs.only }}
      REDO: ${{ github.event.inputs.redo }}
      CASE: ${{ github.event.inputs.case }}
      SCENES: crime/${{ github.event.inputs.case }}/scenes.json
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Bring back pictures drawn earlier
        run: |
          mkdir -p out
          if git fetch -q --depth 1 origin pics-${CASE}; then git --work-tree=out checkout FETCH_HEAD -- . && git reset -q; fi
      - run: python crime/pictures.py
      - name: Save the pictures to the pics-${CASE} branch
        if: always()
        run: |
          ls out/*.jpg >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/s && cp out/*.jpg /tmp/s/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q --orphan pics-${CASE} && git rm -rfq . && cp /tmp/s/*.jpg . && git add *.jpg
          git commit -qm "${CASE} pictures" && git push -f origin pics-${CASE}
